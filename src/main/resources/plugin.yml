name: QianDao
main: cn.qiandao.qiandao.QianDaoPlugin
version: 1.1.4
description: "1.12.2 每日签到插件 - 七日周期奖励 / 连续签到额外奖励 / 补签卡 / 签到排名 / 金币联动"
authors: [TRAE]
softdepend: [ZPoints, PlayerPoints, Vault]

commands:
  qiandao:
    description: 打开签到面板
    aliases: [qd, sign, qiandao]
    usage: /qd [givecard|reload|rank]

permissions:
  qiandao.use:
    description: 使用签到功能
    default: true
  qiandao.admin:
    description: 管理员命令(发放补签卡/重载配置)
    default: op