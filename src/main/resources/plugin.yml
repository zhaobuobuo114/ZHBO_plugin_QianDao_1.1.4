name: ZHBO_plugin_QianDao_1.1.4
main: cn.qiandao.qiandao.QianDaoPlugin
version: 1.1.4
description: "【ZHBO】plugin_QianDao_1.1.4 | 1.12.2 每日签到插件 - 七日周期奖励 / 连续签到额外奖励 / 补签卡 / 签到排名 / 金币联动 | 作者: zhaobuobuo | 联系: 1071576270@QQ.COM"
authors: [zhaobuobuo]
website: "mailto:1071576270@QQ.COM"
softdepend: [ZPoints, PlayerPoints, Vault]

commands:
  qiandao:
    description: 打开签到面板
    aliases: [qd, sign, qiandao]
    usage: /qd [givecard|reload|rank]

permissions:
  qiandao.use:
    description: 使用签到功能
    default: true
  qiandao.admin:
    description: 管理员命令(发放补签卡/重载配置)
    default: op